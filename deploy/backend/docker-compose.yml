# Backend DVF Insights sur le VPS : Postgres + PostgREST + les deux Edge Functions sous Deno.
# Remplace le projet Supabase : même API (/rest/v1, /functions/v1) servie par nginx sur dvf.lyfh.fr.
# Secrets dans .env (jamais versionné), voir .env.example.
name: dvf-backend

services:
  db:
    build: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dvf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=dvf
      -c shared_buffers=768MB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c max_connections=60
      -c timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dvf"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v13.0.4
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/dvf
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_OPENAPI_MODE: disabled
    ports:
      - "127.0.0.1:3010:3000"

  fn-ingest-dvf:
    image: denoland/deno:2.1.4
    restart: unless-stopped
    working_dir: /fn/ingest-dvf
    command: ["run", "-A", "index.ts"]
    environment: &fn-env
      DENO_SERVE_ADDRESS: tcp:0.0.0.0:8000
      DENO_DIR: /deno-dir
      SUPABASE_URL: https://dvf.lyfh.fr
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
    extra_hosts:
      - "dvf.lyfh.fr:${PUBLIC_IP}"
    volumes:
      - ../../supabase/functions:/fn:ro
      - denocache:/deno-dir
    ports:
      - "127.0.0.1:8101:8000"

  fn-pipeline-status:
    image: denoland/deno:2.1.4
    restart: unless-stopped
    working_dir: /fn/pipeline-status
    command: ["run", "-A", "index.ts"]
    environment: *fn-env
    extra_hosts:
      - "dvf.lyfh.fr:${PUBLIC_IP}"
    volumes:
      - ../../supabase/functions:/fn:ro
      - denocache:/deno-dir
    ports:
      - "127.0.0.1:8102:8000"

volumes:
  pgdata:
  denocache:
