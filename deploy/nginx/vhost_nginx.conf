# DVF Insights : SPA statique servie directement par nginx (Plesk, dvf.lyfh.fr).
# Installé dans /var/www/vhosts/system/dvf.lyfh.fr/conf/vhost_nginx.conf
# (fichier d'extension conservé par Plesk, inclus dans les blocs server HTTP et HTTPS).
# Reproduit le comportement de vercel.json : rewrites SPA, cache immuable sur /assets,
# en-têtes de sécurité. Le certificat et la redirection HTTP vers HTTPS sont gérés par Plesk.
# Le docroot est le lien symbolique .../dvf.lyfh.fr/current (releases/<horodatage>-<sha>).

# Compression (brotli si le module est chargé, gzip en repli).
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml application/manifest+json;
brotli on;
brotli_comp_level 5;
brotli_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml application/manifest+json;

# Assets hachés par Vite : cache immuable. Un chunk absent répond 404 (jamais index.html).
location ^~ /assets/ {
	try_files $uri =404;
	add_header Cache-Control "public, max-age=31536000, immutable" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Pas d'API : /api/* répond 404 (équivalent du rewrite Vercel qui exclut api/).
location ^~ /api/ {
	return 404;
}

# Tout le reste : fichier réel s'il existe, sinon index.html (routes React Router).
# Pas de cache long : la page doit toujours être revalidée pour pointer vers les bons assets.
location ~ ^/(?!assets/|api/) {
	try_files $uri /index.html;
	add_header Cache-Control "no-cache" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
